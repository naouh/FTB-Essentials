org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=ftbessentials
readable_name=FTB Essentials
archives_base_name=ftb-essentials
maven_group=dev.ftb.mods

minecraft_version=26.3
supported_minecraft_versions=26.3
minecraft_version_range_maven=[26.3,27)

# ultimateneo: full version becomes 26.3.0.1-ultimateneo (createModVersion prefixes the MC version)
mod_version=1-ultimateneo
mod_author=FTB Team

# Deps
moddev_version=2.0.148
neoforge_version=26.3.0.101
neoforge_version_range=[26.3.0.101,27)
neoforge_loader_version=4

# local build of FTB Library (publishToMavenLocal from naouh/FTB-Library ultimateneo/26.3)
ftb_library_version=26.3.0.1-ultimateneo
ftb_library_version_range_maven=[26.3.0.1,27)

# FTB Ranks is optional and has no 26.3 build: compile-only against the 26.1.2 API
ftb_ranks_version=26.1.2.4
ftb_ranks_version_range_maven=[26.1.2.1,27)

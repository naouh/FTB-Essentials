plugins {
    id 'net.neoforged.moddev'
}

// ultimateneo: common is compiled against the NeoForge-patched Minecraft with ModDevGradle
// (previously Fabric Loom; the access widener was empty).
neoForge {
    version = project.neoforge_version
}

dependencies {
    implementation("dev.ftb.mods:ftb-library:${rootProject.ftb_library_version}")
    // optional integrations
    compileOnly("dev.ftb.mods:ftb-ranks:${rootProject.ftb_ranks_version}")
    compileOnly "net.luckperms:api:5.4"
}

test {
    useJUnitPlatform()
}
